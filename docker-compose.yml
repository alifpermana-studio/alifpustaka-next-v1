version: "3.8"

services:
  alifpustaka-main:
    image: alifpustaka-main:latest
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - NODE_ENV=production
    container_name: alifpustaka-main
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      - NODE_ENV=production
    networks:
      - alifpustaka-network
      - traefik-network
      - postgres-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.apus-app.rule=Host(`${ADMIN_DOMAIN}`)"
      - "traefik.http.routers.apus-main.entrypoints=websecure"
      - "traefik.http.routers.apus-main.tls.certresolver=letsencrypt"
      - "traefik.http.services.apus-main.loadbalancer.server.port=3000"
      - "traefik.docker.network=traefik-network"
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:3000/api/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  alifpustaka-network:
    external: true
    name: alifpustaka-network
  traefik-network:
    external: true
    name: traefik-network
  postgres-network:
    external: true
    name: postgres-network
